<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cagnottes</title>
  <meta name="description" content="Récompense tes petits efforts : des cagnottes d'Éclats pour tes envies.">
  <meta name="theme-color" content="#175C4C">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!--
    Bandeau persistant : les deux monnaies, clairement dissociées.
    À gauche les Éclats (registre commun, gagnés dans les autres apps) ;
    à droite la Bourse en euros (ce qui est réellement versable ici).
  -->
  <header id="eclats-header">
    <button class="eh-part" data-action="goto-eclats" title="Voir mes Éclats et le taux">
      <span class="eh-icon">✦</span>
      <span class="eh-bloc">
        <span class="eh-solde" id="eh-eclats">—</span>
        <span class="eh-label">Éclats</span>
      </span>
    </button>
    <span class="eh-fleche">→</span>
    <button class="eh-part eh-droite" data-action="goto-eclats" title="Voir la Bourse">
      <span class="eh-bloc eh-fin">
        <span class="eh-solde" id="eh-bourse">0,00 €</span>
        <span class="eh-label eh-engage"></span>
      </span>
      <span class="eh-icon">€</span>
    </button>
  </header>

  <main id="view"></main>

  <nav id="bottom-nav">
    <a href="#/" data-route="home"><span>🏠</span>Cagnottes</a>
    <a href="#/stats" data-route="stats"><span>📊</span>Stats</a>
    <a href="#/change" data-route="change"><span class="ico-change">✦<i>→</i>€</span>Change</a>
    <a href="#/archives" data-route="archives"><span>🏆</span>Archives</a>
    <a href="#/reglages" data-route="reglages"><span>⚙️</span>Réglages</a>
  </nav>

  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <!--
    Les scripts classiques posent les objets globaux (U, Charts, Views, App),
    puis le module `main.js` assemble le registre d'Éclats et démarre l'app.
    Un module s'exécute toujours après les scripts classiques : l'ordre est donc
    garanti sans `defer`.
  -->
  <script src="js/utils.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/views.js"></script>
  <script src="js/app.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
