<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cagnottes</title>
  <meta name="description" content="Récompense tes petits efforts : des cagnottes d'Éclats pour tes envies.">
  <meta name="theme-color" content="#175C4C">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Bandeau Bourse persistant (visible sur les 6 écrans) -->
  <header id="eclats-header" data-action="goto-eclats" title="Voir la Bourse et le taux">
    <span class="eh-icon">💶</span>
    <span class="eh-label">Bourse</span>
    <span class="eh-engage"></span>
    <span class="eh-solde">0,00 €</span>
    <span class="eh-chevron">›</span>
  </header>

  <main id="view"></main>

  <nav id="bottom-nav">
    <a href="#/" data-route="home"><span>🏠</span>Cagnottes</a>
    <a href="#/stats" data-route="stats"><span>📊</span>Stats</a>
    <a href="#/change" data-route="change"><span>💱</span>Change</a>
    <a href="#/archives" data-route="archives"><span>🏆</span>Archives</a>
    <a href="#/reglages" data-route="reglages"><span>⚙️</span>Réglages</a>
  </nav>

  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <!--
    Les scripts classiques posent les objets globaux (U, Charts, Views, App),
    puis le module `main.js` assemble le registre d'Éclats et démarre l'app.
    Un module s'exécute toujours après les scripts classiques : l'ordre est donc
    garanti sans `defer`.
  -->
  <script src="js/utils.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/views.js"></script>
  <script src="js/app.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
